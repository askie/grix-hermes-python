[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "grix-hermes"
dynamic = ["version"]
description = "Grix/aibot protocol platform adapter plugin for Hermes Agent"
requires-python = ">=3.11"
dependencies = [
    "aiohttp>=3.9",
]

# Single source of truth: the version lives only in plugin.yaml (the Hermes
# plugin manifest). _version.py parses it so the wheel metadata always matches.
[tool.setuptools.dynamic]
version = {attr = "_version.__version__"}

[project.optional-dependencies]
yaml = ["pyyaml>=6.0"]

[project.entry-points."hermes_agent.plugins"]
grix-hermes = "grix_hermes"

[tool.setuptools.packages.find]
include = ["grix_hermes*"]

[tool.setuptools.package-data]
grix_hermes = ["plugin_skills/*/SKILL.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--import-mode=importlib"
